# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/api-gateway/webserver.pid;
error_log /var/log/sdkwork/api-gateway/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        listen 443 ssl;
        server_name api-dev.sdkwork.com api-dev.birdcoder.com api-dev.dtupay.com api-dev.noaper.com api-dev.sdkwork.cn api-dev.birdcoder.cn api-dev.dtupay.cn api-dev.noaper.cn api-dev.skubc.com api-dev.skubc.cn api-dev.zowalk.com api-dev.zowalk.cn api-dev.offer86.com api-dev.offer86.cn api-dev.86offer.com api-dev.86offer.cn;
        http2 on;
        include snippets/gateway-locations.nonproduction.conf;
        ssl_certificate /etc/sdkwork/certs/letsencrypt/api-dev.birdcoder.com/fullchain.pem;
        ssl_certificate_key /etc/sdkwork/certs/letsencrypt/api-dev.birdcoder.com/privkey.pem;
        ssl_trusted_certificate /etc/sdkwork/certs/letsencrypt/api-dev.birdcoder.com/chain.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
    }
}
