# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/api-gateway/webserver.pid;
error_log /var/log/sdkwork/api-gateway/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name api-demo.sdkwork.com api-demo.birdcoder.com api-demo.dtupay.com api-demo.noaper.com api-demo.sdkwork.cn api-demo.birdcoder.cn api-demo.dtupay.cn api-demo.noaper.cn api-demo.skubc.com api-demo.skubc.cn api-demo.zowalk.com api-demo.zowalk.cn api-demo.offer86.com api-demo.offer86.cn api-demo.86offer.com api-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
