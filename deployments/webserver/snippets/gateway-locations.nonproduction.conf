# Gateway location snippet (nonproduction) — SDKWORK_WEBSERVER_SPEC.md §2.4
# Referenced from server.include; do not edit locations inline in environment files.
#
# Exposure governance: unauthenticated diagnostics surfaces are never forwarded
# by an edge on any tier, so the edge answers /metrics and /livez itself with
# 404 instead of proxying the gateway's diagnostics endpoints.

    location = /metrics {
        return 404;
    }

    location = /livez {
        return 404;
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
