# Gateway location snippet (production) — SDKWORK_WEBSERVER_SPEC.md §2.4
# Referenced from server.include; do not edit locations inline in environment files.

    location = /healthz {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No WebSocket surface lives under /api/. Sending `Connection: upgrade`
        # there marked every API call as a protocol-upgrade candidate on the
        # upstream side, which HTTP/1.1 does not mean and the gateway does not
        # expect.
        proxy_set_header Connection "";
        # Relay streams (chat completions) must reach the client frame by frame.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # Forward the client's own connection semantics instead of forcing
        # `upgrade` on every request: a real WebSocket handshake still upgrades,
        # while ordinary API traffic keeps keep-alive. Referencing the client
        # header (rather than a `$connection_upgrade` map) keeps this snippet
        # valid in any http block without an extra configuration surface.
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        # Long agent/coding completions stream for minutes, and a provider may
        # legitimately pause while it thinks. A 120 s proxy read timeout cut
        # healthy streams mid-answer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
