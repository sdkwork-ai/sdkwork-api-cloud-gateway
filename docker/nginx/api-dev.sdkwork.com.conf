# api-dev.sdkwork.com (+ aliases) -> development container gateway.
# Canonical deploy path: /etc/nginx/sites-enabled/sdkwork/api-dev.sdkwork.com.conf
# NGINX_SPEC §2: preserve Host/X-Forwarded-*, websocket upgrade headers,
# disable proxy buffering for streaming, long read/send timeouts.
server {
    listen 80;
    listen [::]:80;
    server_name api-dev.sdkwork.com api-dev.birdcoder.com api-dev.dtupay.com;

    access_log /var/log/nginx/api-dev.sdkwork.com.access.log;
    error_log /var/log/nginx/api-dev.sdkwork.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1100m;
    }
}
