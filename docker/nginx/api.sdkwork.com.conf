# api.sdkwork.com (+ aliases) -> production container gateway.
# Canonical deploy path: /etc/nginx/sites-enabled/sdkwork/api.sdkwork.com.conf
# NGINX_SPEC §2: preserve Host/X-Forwarded-*, websocket upgrade headers,
# disable proxy buffering for streaming, long read/send timeouts.
# Certificate: /etc/ssl/sdkwork/api-gateway/ (multi-SAN self-signed for
# api.sdkwork.com / api.birdcoder.com / api.dtupay.com; replace with the
# Let's Encrypt fullchain once public DNS + ACME are available).
server {
    listen 80;
    listen [::]:80;
    server_name api.sdkwork.com api.birdcoder.com api.dtupay.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sdkwork.com api.birdcoder.com api.dtupay.com;

    ssl_certificate /etc/ssl/sdkwork/api-gateway/fullchain.pem;
    ssl_certificate_key /etc/ssl/sdkwork/api-gateway/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/api.sdkwork.com.access.log;
    error_log /var/log/nginx/api.sdkwork.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3913;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1100m;
    }
}
