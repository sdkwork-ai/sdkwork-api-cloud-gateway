# sdkwork-api-cloud-gateway production domains -> container gateway.
# Install: sudo cp docker/nginx/api-gateway-production.conf /etc/nginx/sites-enabled/sdkwork/
# (NGINX_SPEC: site files live under /etc/nginx/sites-enabled/sdkwork/<domain>.conf)
# Requires real DNS for api.sdkwork.com / api.birdcoder.com / api.dtupay.com
# pointing at this host, and TLS certificates for each name (certbot or a
# cloud CA). Replace the certificate paths below before enabling.
#
# The gateway enforces its host allowlist from the forwarded Host header
# (SDKWORK_API_CLOUD_GATEWAY_ALLOWED_HOSTS / [security].allowedHosts must
# contain all three names), so the real domain is passed through and preserved
# for public URL generation. HTTPS terminates here; the backend link to the
# gateway container on 127.0.0.1:3910 stays plain HTTP inside the host.

# HTTP -> HTTPS redirect for the three production names.
server {
    listen 80;
    listen [::]:80;
    server_name api.sdkwork.com api.birdcoder.com api.dtupay.com;

    access_log /var/log/nginx/api-gateway-production.access.log;
    error_log /var/log/nginx/api-gateway-production.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production TLS site.
server {
    # `ssl http2` syntax keeps compatibility with nginx 1.18 (Ubuntu LTS);
    # nginx >= 1.25.1 may use `listen 443 ssl; http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sdkwork.com api.birdcoder.com api.dtupay.com;

    # Replace with the actual certificate paths (one cert per name, or a
    # SAN/wildcard certificate covering all three).
    ssl_certificate     /etc/ssl/sdkwork/api-gateway/fullchain.pem;
    ssl_certificate_key /etc/ssl/sdkwork/api-gateway/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SDKWORK_GATEWAY_SSL:10m;

    access_log /var/log/nginx/api-gateway-production.access.log;
    error_log /var/log/nginx/api-gateway-production.error.log;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
    }
}
