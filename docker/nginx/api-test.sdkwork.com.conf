# api-test.sdkwork.com (+ aliases) -> test container gateway.
# Canonical deploy path: /etc/nginx/sites-enabled/sdkwork/api-test.sdkwork.com.conf
server {
    listen 80;
    listen [::]:80;
    server_name api-test.sdkwork.com api-test.birdcoder.com api-test.dtupay.com;

    access_log /var/log/nginx/api-test.sdkwork.com.access.log;
    error_log /var/log/nginx/api-test.sdkwork.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
    }
}
