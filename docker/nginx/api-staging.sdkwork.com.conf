# api-staging.sdkwork.com (+ aliases) -> staging container gateway (host port 3912).
# Generated by scripts/deploy/generate-nginx-conf.sh — do not edit by hand.
# Install path: /etc/nginx/sites-enabled/sdkwork/api-staging.sdkwork.com.conf
# HTTP (80) + HTTPS (443) enabled. Certs: /etc/ssl/sdkwork/api-gateway/staging/{fullchain,privkey}.pem

server {
    listen 80;
    listen [::]:80;
    server_name api-staging.sdkwork.com api-staging.birdcoder.com api-staging.noaper.com api-staging.dtupay.com api-staging.noaper.com api-staging.sdkwork.cn api-staging.birdcoder.cn api-staging.noaper.cn api-staging.dtupay.cn api-staging.noaper.cn api-staging.skubc.com api-staging.noaper.com api-staging.skubc.cn api-staging.noaper.cn api-staging.zowalk.com api-staging.noaper.com api-staging.zowalk.cn api-staging.noaper.cn api-staging.offer86.com api-staging.noaper.com api-staging.offer86.cn api-staging.noaper.cn api-staging.86offer.com api-staging.noaper.com api-staging.86offer.cn;api-staging.noaper.cn;

    access_log /var/log/nginx/api-staging.sdkwork.com.access.log;
    error_log  /var/log/nginx/api-staging.sdkwork.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3912;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1100m;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-staging.sdkwork.com api-staging.birdcoder.com api-staging.noaper.com api-staging.dtupay.com api-staging.noaper.com api-staging.sdkwork.cn api-staging.birdcoder.cn api-staging.noaper.cn api-staging.dtupay.cn api-staging.noaper.cn api-staging.skubc.com api-staging.noaper.com api-staging.skubc.cn api-staging.noaper.cn api-staging.zowalk.com api-staging.noaper.com api-staging.zowalk.cn api-staging.noaper.cn api-staging.offer86.com api-staging.noaper.com api-staging.offer86.cn api-staging.noaper.cn api-staging.86offer.com api-staging.noaper.com api-staging.86offer.cn;api-staging.noaper.cn;

    ssl_certificate /etc/ssl/sdkwork/api-gateway/staging/fullchain.pem;
    ssl_certificate_key /etc/ssl/sdkwork/api-gateway/staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/api-staging.sdkwork.com.access.log;
    error_log  /var/log/nginx/api-staging.sdkwork.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:3912;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1100m;
    }
}
