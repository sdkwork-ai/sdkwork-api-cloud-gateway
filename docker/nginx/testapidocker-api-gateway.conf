# sdkwork-api-cloud-gateway docker test domains -> container gateway.
# Windows hosts: 127.0.0.1 testapidocker.sdkwork.com testapidocker.birdcoder.com testapidocker.dtupay.com
# The gateway enforces its host allowlist from the forwarded Host header
# (SDKWORK_API_CLOUD_GATEWAY_ALLOWED_HOSTS in docker-compose.yml), so the real
# domain is passed through and preserved for public URL generation.
server {
    listen 80;
    listen [::]:80;
    server_name testapidocker.sdkwork.com testapidocker.birdcoder.com testapidocker.dtupay.com;

    access_log /var/log/nginx/testapidocker-api-gateway.access.log;
    error_log /var/log/nginx/testapidocker-api-gateway.error.log;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
    }
}
