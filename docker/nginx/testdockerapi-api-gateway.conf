# sdkwork-api-cloud-gateway docker test domains (testdockerapi.*) -> test env gateway.
# Docker-deployed test environments use the testdockerapi.* prefix (testapi.*
# belongs to WSL direct-run instances). The test docker stack maps host port
# 3911 -> container 3900 (port matrix: deployments/README.md); adjust
# proxy_pass when GATEWAY_HOST_PORT differs.
# Windows hosts: 127.0.0.1 testdockerapi.sdkwork.com testdockerapi.birdcoder.com testdockerapi.dtupay.com
# The gateway enforces its host allowlist from the forwarded Host header
# (SDKWORK_API_CLOUD_GATEWAY_ALLOWED_HOSTS in the compose .env), so the real
# domain is passed through and preserved for public URL generation.
server {
    listen 80;
    listen [::]:80;
    server_name testdockerapi.sdkwork.com testdockerapi.birdcoder.com testdockerapi.dtupay.com;

    access_log /var/log/nginx/testdockerapi-api-gateway.access.log;
    error_log /var/log/nginx/testdockerapi-api-gateway.error.log;

    location / {
        proxy_pass http://127.0.0.1:3911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1100m;
    }
}
