# SDKWork API Cloud Gateway — container runtime config (host-mounted override).
#
# This file is mounted read-only at the canonical container/Ubuntu config path
#   /etc/sdkwork/api-gateway/config.toml
# (APPLICATION_DEPLOY_LAYOUT_SPEC + RUNTIME_DIRECTORY_SPEC §4.5). Same layout
# as the Ubuntu systemd install. Edit host-side to change settings that
# environment variables do not cover.
#
# Configuration precedence (ENVIRONMENT_SPEC §3):
#   1. built-in defaults
#   2. this TOML file
#   3. process environment (docker-compose.yml / .env)  <- wins over this file
#   4. command-line arguments (local tooling only)
#   5. secret manager / OS secure storage
#
# docker-compose.yml injects the container-specific values via SDKWORK_* env:
# bind address, Host allow-list, CORS origins, PostgreSQL connection,
# IM principal directory, Cloud Router secrets, Redis, object store roots,
# snowflake node id, payment master key. Values set there override this file.
#
# Secrets never belong here: mount them under
# /run/secrets/sdkwork/api-gateway/<secret-name> (container) or
# /etc/sdkwork/api-gateway/secrets/ (Ubuntu install) and reference file paths
# from config, or inject SDKWORK_*_FILE env pointers
# (ENVIRONMENT_SPEC §7.3, RUNTIME_DIRECTORY_SPEC §11).

mode = "embedded"

[service]
name = "sdkwork-api-cloud-gateway"
environment = "production"

[server]
bind = "0.0.0.0:3900"

[database]
# Container entrypoint runs the explicit `--migrate-databases` lifecycle step
# before service startup. Runtime auto-migration remains disabled.
autoMigrate = false
bind = "0.0.0.0:3900"

