anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-tungstenite = "0.29"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
# OpenTelemetry OTLP span export (0.31 family, unified with the codex external chain)
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.32"
async-trait = "0.1"

sdkwork-api-cloud-gateway-config = { path = "crates/sdkwork-api-cloud-gateway-config" }
sdkwork-api-cloud-gateway-observability = { path = "crates/sdkwork-api-cloud-gateway-observability" }
sdkwork-api-cloud-gateway-registry = { path = "crates/sdkwork-api-cloud-gateway-registry" }
sdkwork-api-cloud-gateway = { path = "crates/sdkwork-api-cloud-gateway" }

sdkwork-api-iam-assembly = { path = "../sdkwork-iam/crates/sdkwork-api-iam-assembly" }

sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-iam-embedded-application-bootstrap = { path = "../sdkwork-iam/crates/sdkwork-iam-embedded-application-bootstrap" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx" }

# Embedded Codex dependency graph (via sdkwork-kernel -> sdkwork-agents)
# requires the openai-oss-forks websocket forks: crates.io tungstenite has no
# `deflate`/`proxy` features, and nested-workspace [patch.crates-io] tables do
# not propagate across workspace roots, so this workspace declares them too.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
