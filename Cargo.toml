[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-cloud-gateway-config",
    "crates/sdkwork-api-cloud-gateway-registry",
    "crates/sdkwork-api-cloud-gateway-observability",
    "crates/sdkwork-api-cloud-gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
