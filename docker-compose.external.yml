# Compatibility shim: external PostgreSQL/Redis is now the default in
# docker-compose.yml (RUNTIME_DIRECTORY_SPEC §4.5). Keeping this file lets
# existing operator commands that pass `-f docker-compose.external.yml`
# continue to work without behavioral change.
#
# Prefer:
#   docker compose --env-file docker/env/<env>.env -f docker-compose.yml up -d
#
# Optional in-compose databases:
#   docker compose --profile embedded -f docker-compose.yml -f docker-compose.embedded.yml up -d

# No-op overlay (compose requires at least one top-level key).
name: sdkwork-api-cloud-gateway-external-shim
