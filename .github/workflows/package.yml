name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.1.11
      package_version:
        description: Package version used in artifact names and manifests; empty derives it from the tag.
        required: false
        default: ''
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - android-tablet
          - ios
          - ipados
          - windows-tablet
          - web
          - container
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
          - armv7
          - universal
          - wasm32
          - noarch
      profile:
        description: Runtime profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - server
          - container
          - desktop
          - mobile
          - tablet
          - web
          - worker
          - library
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging (no deployments[] are declared; see sdkwork.workflow.json).
        required: true
        default: false
        type: boolean
      dependency_refs_json:
        description: Optional JSON object overriding dependency refs, for example {"SDKWORK_IAM_REF":"abc123"}. Omitted entries resolve from the SDKWORK_*_REF repository variables, then main.
        required: false
        default: '{}'

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

jobs:
  package:
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-package.yml@77edc9d27aedbd7370d34eae4d3e946526f5be25
    with:
      config_path: sdkwork.workflow.json
      tag: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      package_version: ${{ github.event.inputs.package_version || '' }}
      platform: ${{ github.event.inputs.platform || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      profile: ${{ github.event.inputs.profile || 'all' }}
      format: ${{ github.event.inputs.format || 'all' }}
      publish_release: true
      upload_artifact: true
      deploy: ${{ github.event.inputs.deploy == 'true' }}
      retention_days: 30
      framework_ref: 77edc9d27aedbd7370d34eae4d3e946526f5be25
      dependency_refs_json: ${{ github.event.inputs.dependency_refs_json || '{}' }}
    secrets: inherit
