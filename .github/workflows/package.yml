name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  # `release.published` is intentionally absent: this workflow publishes its own
  # aggregate release at the end of a tag run, and a release event would start a
  # second full matrix for that same tag (the v0.1.12 tag produced both a push
  # run and a release run). Manual releases are packaged by pushing a tag or by
  # dispatching this workflow.
  workflow_dispatch:
    # GitHub accepts at most 25 workflow_dispatch inputs, so dependency refs are
    # declared as fixed refs in sdkwork.workflow.json (GITHUB_WORKFLOW_SPEC:
    # "Dependency refs may come from a fixed ref or from a declared refInput").
    # Every runtime dependency therefore tracks its repository's main branch.
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.1.13
      package_version:
        description: Package version used in artifact names and manifests; empty derives it from the tag.
        required: false
        default: ''
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - android-tablet
          - ios
          - ipados
          - windows-tablet
          - web
          - container
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
          - armv7
          - universal
          - wasm32
          - noarch
      profile:
        description: Runtime profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - server
          - container
          - desktop
          - mobile
          - tablet
          - web
          - worker
          - library
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging (no deployments[] are declared; see sdkwork.workflow.json).
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    name: Package
    uses: sdkwork-ai/sdkwork-github-workflow/.github/workflows/sdkwork-package.yml@893a49fba5f1e26a05558b031b2fd52ebbfe2c7f
    with:
      config_path: sdkwork.workflow.json
      tag: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
      package_version: ${{ github.event.inputs.package_version || '' }}
      platform: ${{ github.event.inputs.platform || 'all' }}
      architecture: ${{ github.event.inputs.architecture || 'all' }}
      profile: ${{ github.event.inputs.profile || 'all' }}
      format: ${{ github.event.inputs.format || 'all' }}
      publish_release: true
      upload_artifact: true
      deploy: ${{ github.event.inputs.deploy == 'true' }}
      retention_days: 30
      framework_ref: 893a49fba5f1e26a05558b031b2fd52ebbfe2c7f
    secrets: inherit
