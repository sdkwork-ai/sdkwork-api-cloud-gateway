name: Package Application

on:
  push:
    tags:
      - v*
      - '*.*.*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag or source ref to package.
        required: true
        default: v0.1.11
      package_version:
        description: Package version used in artifact names and manifests; empty derives it from the tag.
        required: false
        default: ''
      platform:
        description: Platform filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - android-tablet
          - ios
          - ipados
          - windows-tablet
          - web
          - container
      architecture:
        description: Architecture filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - x64
          - arm64
          - armv7
          - universal
          - wasm32
          - noarch
      profile:
        description: Runtime profile filter.
        required: true
        default: all
        type: choice
        options:
          - all
          - server
          - container
          - desktop
          - mobile
          - tablet
          - web
          - worker
          - library
      format:
        description: Package format filter.
        required: true
        default: all
      deploy:
        description: Run configured deployment environments after packaging (no deployments[] are declared; see sdkwork.workflow.json).
        required: true
        default: false
        type: boolean
      sdkwork_iam_ref:
        description: sdkwork-ai/sdkwork-iam commit/ref.
        required: false
        default: main
      sdkwork_drive_ref:
