mode = "embedded"

[service]
name = "sdkwork-api-cloud-gateway"
environment = "test"

[server]
# Test environment bind. Fixed port so deployed test instances are reachable
# at a known address; the port matrix (docker/README port plan) reserves:
#   3906  WSL/Ubuntu direct test deployment (127.0.0.1)
#   3911  container test deployment (host side -> 3900)
# Concurrency-safe alternative for ephemeral test runs remains `127.0.0.1:0`.
bind = "127.0.0.1:3906"

[database]
# Initialize every embedded database module on first start
# (fresh install or version upgrade). Set false to manage schema
# lifecycle explicitly; SDKWORK_DATABASE_AUTO_MIGRATE still overrides.
autoMigrate = true

[cors]
allowAnyOrigin = false
allowedOrigins = ["http://localhost:3911", "http://127.0.0.1:3911"]

[cors.registeredConsoleHosts]
labels = ["account", "admin", "agent", "agents", "agents-admin", "agents-app", "agents-open", "agentstudio", "agentstudio-admin", "agentstudio-app", "aiot", "aiot-admin", "aiot-app", "api", "appbase", "appstore", "assets", "audio", "audio-api", "birdcoder2", "browser", "canvas", "cloudrouter", "cms", "code", "codebox", "community", "company", "console", "course", "customer-service", "deploy", "deploy-admin", "deploy-app", "dezhou", "discovery", "discovery-admin", "doc", "documents", "documents-admin", "documents-open", "doudizhu", "drama", "drive", "drive-internal", "events", "feeds", "forum", "gameengine", "games", "generations", "github", "github-workflow", "harness", "iam", "im", "image", "inventory", "invoice", "kernel", "knowledge", "knowledgebase", "knowledgebase-admin", "llm", "llm-admin", "llm-app", "llm-open", "local-router", "mahjong", "mail", "mcp", "mem", "membership", "memory", "memory-admin", "memory-app", "memory-open", "merchandise", "messaging", "modelkit", "models", "music", "news", "notary", "notary-admin", "notes", "order", "partner", "payment", "portal", "promotion", "prompts", "router", "router-admin", "router-open", "rtc", "search", "server", "server-admin", "server-app", "settings", "shop", "skills", "terminal", "tts", "video", "video-cut", "voice", "web-internal", "web-provider-events", "xiangqi"]
environmentSuffix = "-test"
schemes = ["http", "https"]

[request]
maxBodyBytes = 33554432

[observability]
accessLogEnabled = false
auditLogEnabled = false
metricsEnabled = false
metricsPath = "/metrics"
tracingEnabled = false
redactHeaders = ["authorization", "access-token", "cookie", "x-api-key", "set-cookie"]

[diagnostics]
enabled = false
path = "/internal/gateway/diagnostics"
includePolicyInventory = true
includeRouteInventory = true

[security]
allowedHosts = ["api-test.sdkwork.com", "api-test.birdcoder.com", "api-test.noaper.com", "api-test.dtupay.com", "api-test.noaper.com", "api-test.sdkwork.cn", "api-test.birdcoder.cn", "api-test.noaper.cn", "api-test.dtupay.cn", "api-test.noaper.cn", "api-test.skubc.com", "api-test.noaper.com", "api-test.skubc.cn", "api-test.noaper.cn", "api-test.zowalk.com", "api-test.noaper.com", "api-test.zowalk.cn", "api-test.noaper.cn", "api-test.offer86.com", "api-test.noaper.com", "api-test.offer86.cn", "api-test.noaper.cn", "api-test.86offer.com", "api-test.noaper.com", "api-test.86offer.cn", "api-test.noaper.cn", "127.0.0.1:3906", "localhost:3906"]
trustedProxyCidrs = []
secureHeadersEnabled = true
maxHeaderBytes = 65536
maxHeaderCount = 128
rejectCredentialHeadersOnAnonymousAuthRoutes = true
csrfGuardEnabled = false

[security.waf]
enabled = false
mode = "monitor"
inspectQuery = true
inspectHeaders = true
inspectJsonBody = false

[traffic]
rateLimitEnabled = false
compatXRateLimitHeaders = true
globalMaxInFlight = 32
rateLimits = []
concurrencyLimits = []

[policy]
enabled = true
dryRun = false
rules = []
