mode = "embedded"

[service]
name = "sdkwork-api-cloud-gateway"
environment = "development"

[server]
bind = "127.0.0.1:3900"

[database]
# Initialize every embedded database module on first start
# (fresh install or version upgrade). Set false to manage schema
# lifecycle explicitly; SDKWORK_DATABASE_AUTO_MIGRATE still overrides.
autoMigrate = true
bind = "127.0.0.1:3900"

# Platform gateway realtime hosting (ADR-20260809-platform-gateway-realtime-hosting):
# embeds the IM session-gateway realtime plane (WebSocket upgrade on this HTTP
# listener plus declared TCP/UDP/QUIC link binds) when the
# `foundation-im-realtime` Cargo feature is enabled and `sdkwork-im` is a
# declared surface. Transport binds and cluster wiring come from the
# SDKWORK_IM_REALTIME_* environment family (see APP_RUNTIME_TOPOLOGY_NAMING.md).
[realtime]
enabled = false

