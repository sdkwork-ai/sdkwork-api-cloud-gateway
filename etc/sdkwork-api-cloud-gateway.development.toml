mode = "embedded"

[service]
name = "sdkwork-api-cloud-gateway"
environment = "development"

[server]
bind = "127.0.0.1:3900"

[database]
# Initialize every embedded database module on first start
# (fresh install or version upgrade). Set false to manage schema
# lifecycle explicitly; SDKWORK_DATABASE_AUTO_MIGRATE still overrides.
autoMigrate = true
bind = "127.0.0.1:3900"

# Platform gateway realtime hosting (ADR-20260809-platform-gateway-realtime-hosting):
# embeds the IM session-gateway realtime plane (WebSocket upgrade on this HTTP
# listener plus declared TCP/UDP/QUIC link binds) when the
# `foundation-im-realtime` Cargo feature is enabled and `sdkwork-im` is a
# declared surface. Transport binds and cluster wiring come from the
# SDKWORK_IM_REALTIME_* environment family (see APP_RUNTIME_TOPOLOGY_NAMING.md).
[realtime]
enabled = false

[cors]
allowAnyOrigin = false
allowedOrigins = ["http://api-dev.sdkwork.com", "https://api-dev.sdkwork.com", "http://api-dev.birdcoder.com", "http://api-dev.noaper.com"", "https://api-dev.birdcoder.com", "https://api-dev.noaper.com"", "http://api-dev.dtupay.com", "http://api-dev.noaper.com"", "https://api-dev.dtupay.com", "https://api-dev.noaper.com"", "http://api-dev.sdkwork.cn", "https://api-dev.sdkwork.cn", "http://api-dev.birdcoder.cn", "http://api-dev.noaper.cn"", "https://api-dev.birdcoder.cn", "https://api-dev.noaper.cn"", "http://api-dev.dtupay.cn", "http://api-dev.noaper.cn"", "https://api-dev.dtupay.cn", "https://api-dev.noaper.cn"", "http://api-dev.skubc.com", "http://api-dev.noaper.com"", "https://api-dev.skubc.com", "https://api-dev.noaper.com"", "http://api-dev.skubc.cn", "http://api-dev.noaper.cn"", "https://api-dev.skubc.cn", "https://api-dev.noaper.cn"", "http://api-dev.zowalk.com", "http://api-dev.noaper.com"", "https://api-dev.zowalk.com", "https://api-dev.noaper.com"", "http://api-dev.zowalk.cn", "http://api-dev.noaper.cn"", "https://api-dev.zowalk.cn", "https://api-dev.noaper.cn"", "http://api-dev.offer86.com", "http://api-dev.noaper.com"", "https://api-dev.offer86.com", "https://api-dev.noaper.com"", "http://api-dev.offer86.cn", "http://api-dev.noaper.cn"", "https://api-dev.offer86.cn", "https://api-dev.noaper.cn"", "http://api-dev.86offer.com", "http://api-dev.noaper.com"", "https://api-dev.86offer.com", "https://api-dev.noaper.com"", "http://api-dev.86offer.cn", "http://api-dev.noaper.cn"", "https://api-dev.86offer.cn", "https://api-dev.noaper.cn"", "http://127.0.0.1:5173", "http://localhost:5173", "app://dsh", "app://birdcoder", "app://sdkwork", "app://dtupay", "tauri://localhost", "https://servicewechat.com"]

[request]
maxBodyBytes = 33554432

[observability]
accessLogEnabled = true
auditLogEnabled = true
metricsEnabled = false
metricsPath = "/metrics"
tracingEnabled = false
redactHeaders = ["authorization", "access-token", "cookie", "x-api-key", "set-cookie"]

[diagnostics]
enabled = true
path = "/internal/gateway/diagnostics"
includePolicyInventory = true
includeRouteInventory = true

[security]
allowedHosts = ["api-dev.sdkwork.com", "api-dev.birdcoder.com", "api-dev.noaper.com"", "api-dev.dtupay.com", "api-dev.noaper.com"", "api-dev.sdkwork.cn", "api-dev.birdcoder.cn", "api-dev.noaper.cn"", "api-dev.dtupay.cn", "api-dev.noaper.cn"", "api-dev.skubc.com", "api-dev.noaper.com"", "api-dev.skubc.cn", "api-dev.noaper.cn"", "api-dev.zowalk.com", "api-dev.noaper.com"", "api-dev.zowalk.cn", "api-dev.noaper.cn"", "api-dev.offer86.com", "api-dev.noaper.com"", "api-dev.offer86.cn", "api-dev.noaper.cn"", "api-dev.86offer.com", "api-dev.noaper.com"", "api-dev.86offer.cn", "api-dev.noaper.cn"", "127.0.0.1:3900", "localhost:3900"]
trustedProxyCidrs = []
secureHeadersEnabled = true
maxHeaderBytes = 65536
maxHeaderCount = 128
rejectCredentialHeadersOnAnonymousAuthRoutes = true
csrfGuardEnabled = false

[security.waf]
enabled = false
mode = "monitor"
inspectQuery = true
inspectHeaders = true
inspectJsonBody = false

[traffic]
rateLimitEnabled = false
compatXRateLimitHeaders = true
globalMaxInFlight = 256
rateLimits = []
concurrencyLimits = []

[policy]
enabled = true
dryRun = false
rules = []
