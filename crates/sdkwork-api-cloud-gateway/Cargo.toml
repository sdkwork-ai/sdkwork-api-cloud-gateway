[package]
name = "sdkwork-api-cloud-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["foundation-appbase"]
foundation-appbase = [
    "dep:sdkwork-api-iam-assembly",
    "dep:sdkwork-iam-web-adapter",
    "dep:sdkwork-iam-database-host",
]
foundation-drive = ["dep:sdkwork-api-drive-assembly", "dep:sdkwork-drive-database-host"]
foundation-membership = ["dep:sdkwork-api-membership-assembly",
    "dep:sdkwork-membership-database-host",
]
foundation-order = ["dep:sdkwork-api-order-assembly",
    "dep:sdkwork-order-database-host",
]
foundation-promotion = ["dep:sdkwork-api-promotion-assembly", "dep:sdkwork-promotion-database-host"]
foundation-payment = ["dep:sdkwork-api-payment-assembly", "dep:sdkwork-payment-database-host"]
manager-operations-suite = [
    "foundation-drive",
    "foundation-membership",
    "foundation-order",
    "foundation-promotion",
    "foundation-payment",
]
foundation-course = [
    "dep:sdkwork-api-course-assembly",
    "dep:sdkwork-course-database-host",
]
foundation-image = ["dep:sdkwork-api-image-assembly",
    "dep:sdkwork-image-database-host",
]
foundation-community = [
    "foundation-appbase",
    "dep:sdkwork-api-community-assembly",
    "dep:sdkwork-community-database-host",
]
foundation-cms = ["dep:sdkwork-api-cms-assembly", "dep:sdkwork-cms-database-host"]
foundation-voice = ["dep:sdkwork-api-voice-assembly", "dep:sdkwork-voice-database-host"]
foundation-aiot = ["dep:sdkwork-api-aiot-assembly", "dep:sdkwork-aiot-database-host"]
foundation-appstore = ["dep:sdkwork-api-appstore-assembly", "dep:sdkwork-appstore-database-host"]
foundation-forum = ["dep:sdkwork-api-forum-assembly", "dep:sdkwork-forum-database-host"]
foundation-cloudrouter = ["dep:sdkwork-api-cloudrouter-assembly", "dep:sdkwork-cloudrouter-database-host"]
foundation-mcp = ["dep:sdkwork-api-mcp-assembly", "dep:sdkwork-mcp-database-host"]
foundation-im = ["dep:sdkwork-api-im-assembly", "dep:sdkwork-im-database-host"]
# Platform gateway realtime hosting: embeds the sdkwork-im session-gateway
# realtime plane (WebSocket upgrade + declared TCP/UDP/QUIC client link
# listeners) into this process per ADR-20260809-platform-gateway-realtime-hosting.
# Opt-in by design; not part of platform-foundation-suite.
foundation-im-realtime = [
    "foundation-im",
    "dep:session-gateway",
    "dep:sdkwork-im-database-pool",
]
foundation-rtc = ["dep:sdkwork-api-rtc-assembly", "dep:sdkwork-rtc-database-host"]
foundation-notary = ["dep:sdkwork-api-notary-assembly", "dep:sdkwork-notary-database-host"]
foundation-mail = ["dep:sdkwork-api-mail-assembly", "dep:sdkwork-mail-database-host"]
foundation-agents = ["dep:sdkwork-api-agents-assembly", "dep:sdkwork-agents-database-host"]
foundation-account = ["dep:sdkwork-api-account-assembly", "dep:sdkwork-account-database-host"]
foundation-catalog = ["dep:sdkwork-api-catalog-assembly", "dep:sdkwork-catalog-database-host"]
foundation-customerservice = ["dep:sdkwork-api-customerservice-assembly", "dep:sdkwork-customerservice-database-host"]
foundation-gameengine = ["dep:sdkwork-api-gameengine-assembly", "dep:sdkwork-gameengine-database-host"]
foundation-inventory = ["dep:sdkwork-api-inventory-assembly", "dep:sdkwork-inventory-database-host"]
foundation-invoice = ["dep:sdkwork-api-invoice-assembly", "dep:sdkwork-invoice-database-host"]
foundation-skills = ["dep:sdkwork-api-skills-assembly",
    "dep:sdkwork-skills-database-host",
]
foundation-local-router = ["dep:sdkwork-api-local-router-assembly", "dep:sdkwork-local-router-database-host"]
foundation-manager = ["dep:sdkwork-api-manager-assembly", "dep:sdkwork-manager-database-host"]
foundation-news = ["dep:sdkwork-api-news-assembly", "dep:sdkwork-news-database-host"]
foundation-portal = ["dep:sdkwork-api-portal-assembly", "dep:sdkwork-portal-database-host"]
foundation-shop = [
    "dep:sdkwork-api-shop-assembly",
    "dep:sdkwork-shop-database-host",
    "dep:sdkwork-merchandise-database-host",
]
foundation-deployments = ["dep:sdkwork-api-deployments-assembly", "dep:sdkwork-deploy-database-host"]
foundation-dezhou = ["dep:sdkwork-api-dezhou-assembly", "dep:sdkwork-dezhou-database-host"]
foundation-documents = ["dep:sdkwork-api-documents-assembly",
    "dep:sdkwork-documents-database-host",
]
foundation-modelkit = ["dep:sdkwork-api-modelkit-assembly", "dep:sdkwork-modelkit-database-host"]
foundation-prompts = ["dep:sdkwork-api-prompts-assembly",
    "dep:sdkwork-prompts-database-host",
]
foundation-web-server = ["dep:sdkwork-api-webserver-assembly", "dep:sdkwork-webserver-database-host"]
foundation-browser = ["dep:sdkwork-api-browser-assembly", "dep:sdkwork-browser-database-host"]
foundation-knowledgebase = ["dep:sdkwork-api-knowledgebase-assembly", "dep:sdkwork-knowledgebase-database-host"]
foundation-llm = ["dep:sdkwork-api-llm-assembly", "dep:sdkwork-llm-database-host"]
foundation-mahjong = ["dep:sdkwork-api-mahjong-assembly", "dep:sdkwork-mahjong-database-host"]
foundation-doudizhu = ["dep:sdkwork-api-doudizhu-assembly", "dep:sdkwork-doudizhu-database-host"]
foundation-xiangqi = ["dep:sdkwork-api-xiangqi-assembly", "dep:sdkwork-xiangqi-database-host"]
platform-foundation-suite = [
    "foundation-appbase",
    "manager-operations-suite",
    "foundation-course",
    "foundation-image",
    "foundation-community",
    "foundation-cms",
    "foundation-voice",
    "foundation-aiot",
    "foundation-appstore",
    "foundation-forum",
    "foundation-cloudrouter",
    "foundation-mcp",
    "foundation-im",
    "foundation-rtc",
    "foundation-notary",
    "foundation-mail",
    "foundation-agents",
    "foundation-account",
    "foundation-catalog",
    "foundation-customerservice",
    "foundation-gameengine",
    "foundation-inventory",
    "foundation-invoice",
    "foundation-skills",
    "foundation-local-router",
    "foundation-manager",
    "foundation-news",
    "foundation-portal",
    "foundation-shop",
    "foundation-deployments",
    "foundation-dezhou",
    "foundation-documents",
    "foundation-modelkit",
    "foundation-prompts",
    "foundation-web-server",
    "foundation-browser",
    "foundation-knowledgebase",
    "foundation-llm",
    "foundation-mahjong",
    "foundation-doudizhu",
    "foundation-xiangqi",
]

