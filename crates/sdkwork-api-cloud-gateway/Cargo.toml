[package]
name = "sdkwork-api-cloud-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["foundation-appbase"]
foundation-appbase = [
    "dep:sdkwork-api-iam-assembly",
    "dep:sdkwork-iam-web-adapter",
]
foundation-drive = ["dep:sdkwork-api-drive-assembly"]
foundation-assets = ["dep:sdkwork-api-assets-assembly"]
foundation-membership = ["dep:sdkwork-api-membership-assembly",
]
foundation-order = ["dep:sdkwork-api-order-assembly",
]
foundation-promotion = ["dep:sdkwork-api-promotion-assembly"]
foundation-payment = ["dep:sdkwork-api-payment-assembly"]
manager-operations-suite = [
    "foundation-drive",
    "foundation-assets",
    "foundation-membership",
    "foundation-order",
    "foundation-promotion",
    "foundation-payment",
]
foundation-course = [
    "dep:sdkwork-api-course-assembly",
]
foundation-image = ["dep:sdkwork-api-image-assembly",
]
foundation-community = [
    "foundation-appbase",
    "dep:sdkwork-api-community-assembly",
]
foundation-cms = ["dep:sdkwork-api-cms-assembly"]
foundation-voice = ["dep:sdkwork-api-voice-assembly"]
foundation-aiot = ["dep:sdkwork-api-aiot-assembly"]
foundation-appstore = ["dep:sdkwork-api-appstore-assembly"]
foundation-forum = ["dep:sdkwork-api-forum-assembly"]
foundation-cloudrouter = [
    "dep:sdkwork-api-cloudrouter-assembly",
]
foundation-mcp = ["dep:sdkwork-api-mcp-assembly"]
foundation-im = ["dep:sdkwork-api-im-assembly"]
# Platform gateway realtime hosting: embeds the sdkwork-im session-gateway
# realtime plane (WebSocket upgrade + declared TCP/UDP/QUIC client link
# listeners) into this process per ADR-20260809-platform-gateway-realtime-hosting.
# Opt-in by design; not part of platform-foundation-suite.
foundation-im-realtime = [
    "foundation-im",
    "dep:session-gateway",
    "dep:sdkwork-im-database-pool",
]
foundation-rtc = ["dep:sdkwork-api-rtc-assembly"]
foundation-notary = ["dep:sdkwork-api-notary-assembly"]
foundation-mail = ["dep:sdkwork-api-mail-assembly"]
foundation-agents = ["dep:sdkwork-api-agents-assembly"]
foundation-generations = ["dep:sdkwork-api-generations-assembly"]
foundation-account = ["dep:sdkwork-api-account-assembly"]
foundation-catalog = ["dep:sdkwork-api-catalog-assembly"]
foundation-customerservice = ["dep:sdkwork-api-customerservice-assembly"]
foundation-gameengine = ["dep:sdkwork-api-gameengine-assembly"]
foundation-inventory = ["dep:sdkwork-api-inventory-assembly"]
foundation-invoice = ["dep:sdkwork-api-invoice-assembly"]
foundation-skills = ["dep:sdkwork-api-skills-assembly",
]
foundation-local-router = ["dep:sdkwork-api-local-router-assembly"]
foundation-manager = ["dep:sdkwork-api-manager-assembly"]
foundation-news = ["dep:sdkwork-api-news-assembly"]
foundation-portal = ["dep:sdkwork-api-portal-assembly"]
foundation-shop = [
    "dep:sdkwork-api-shop-assembly",
]
foundation-deployments = ["dep:sdkwork-api-deployments-assembly"]
foundation-dezhou = ["dep:sdkwork-api-dezhou-assembly"]
foundation-documents = ["dep:sdkwork-api-documents-assembly",
]
foundation-modelkit = ["dep:sdkwork-api-modelkit-assembly"]
foundation-prompts = ["dep:sdkwork-api-prompts-assembly",
]
foundation-webserver = ["dep:sdkwork-api-webserver-assembly"]
foundation-browser = ["dep:sdkwork-api-browser-assembly"]
foundation-knowledgebase = [
    "dep:sdkwork-api-knowledgebase-assembly",
]
foundation-llm = ["dep:sdkwork-api-llm-assembly"]
foundation-mahjong = ["dep:sdkwork-api-mahjong-assembly"]
foundation-doudizhu = ["dep:sdkwork-api-doudizhu-assembly"]
foundation-xiangqi = ["dep:sdkwork-api-xiangqi-assembly"]
platform-foundation-suite = [
    "foundation-appbase",
    "manager-operations-suite",
    "foundation-course",
    "foundation-image",
    "foundation-community",
    "foundation-cms",
    "foundation-voice",
    "foundation-aiot",
    "foundation-appstore",
    "foundation-forum",
    "foundation-cloudrouter",
    "foundation-mcp",
    "foundation-im",
    "foundation-rtc",
    "foundation-notary",
    "foundation-mail",
    "foundation-agents",
    "foundation-account",
    "foundation-catalog",
    "foundation-customerservice",
    "foundation-gameengine",
    "foundation-inventory",
    "foundation-invoice",
    "foundation-skills",
    "foundation-local-router",
    "foundation-manager",
    "foundation-news",
    "foundation-portal",
    "foundation-shop",
    "foundation-deployments",
    "foundation-dezhou",
    "foundation-documents",
    "foundation-modelkit",
    "foundation-prompts",
    "foundation-webserver",
    "foundation-browser",
    "foundation-knowledgebase",
    "foundation-llm",
    "foundation-mahjong",
    "foundation-doudizhu",
    "foundation-xiangqi",
    "foundation-generations",
]

