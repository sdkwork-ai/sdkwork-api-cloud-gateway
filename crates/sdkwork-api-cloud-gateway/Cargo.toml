[package]
name = "sdkwork-api-cloud-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["foundation-appbase"]
foundation-appbase = [
    "dep:sdkwork_routes_iam_app_api",
    "dep:sdkwork_routes_iam_backend_api",
    "dep:sdkwork-iam-web-adapter",
    "dep:sdkwork-iam-database-host",
    "dep:sdkwork-iam-embedded-application-bootstrap",
]
foundation-course = [
    "dep:sdkwork_routes_course_app_api",
    "dep:sdkwork_routes_course_backend_api",
    "dep:sdkwork-course-gateway-assembly",
]
foundation-news = ["dep:sdkwork_routes_news_app_api", "dep:sdkwork_routes_news_backend_api", "dep:sdkwork_routes_news_open_api"]
foundation-image = ["dep:sdkwork_routes_image_app_api", "dep:sdkwork_routes_image_backend_api", "dep:sdkwork_routes_image_open_api"]
foundation-forum = ["dep:sdkwork_routes_forum_app_api", "dep:sdkwork_routes_forum_backend_api", "dep:sdkwork_routes_forum_open_api"]
foundation-music = ["dep:sdkwork_routes_music_app_api", "dep:sdkwork_routes_music_backend_api"]
foundation-messaging = ["dep:sdkwork_routes_messaging_app_api", "dep:sdkwork_routes_messaging_backend_api"]
foundation-community = ["dep:sdkwork_routes_community_app_api"]
foundation-cms = ["dep:sdkwork_routes_cms_app_api", "dep:sdkwork_routes_cms_backend_api", "dep:sdkwork_routes_cms_open_api"]
foundation-voice = ["dep:sdkwork_routes_voice_app_api", "dep:sdkwork_routes_voice_backend_api"]
foundation-aiot = ["dep:sdkwork_routes_aiot_app_api"]
foundation-appstore = ["dep:sdkwork_routes_catalog_app_api", "dep:sdkwork_routes_catalog_backend_api", "dep:sdkwork_routes_catalog_open_api"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
sdkwork-api-cloud-gateway-config.workspace = true
sdkwork-api-cloud-gateway-observability.workspace = true
sdkwork-api-cloud-gateway-registry.workspace = true
sdkwork-web-contract.workspace = true
sdkwork-web-core.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-utils-rust.workspace = true
sdkwork-iam-web-adapter = { workspace = true, optional = true }
sdkwork-iam-database-host = { workspace = true, optional = true }
sdkwork-iam-embedded-application-bootstrap = { workspace = true, optional = true }
sdkwork_routes_iam_app_api = { workspace = true, optional = true }
sdkwork_routes_iam_backend_api = { workspace = true, optional = true }
sdkwork_routes_course_app_api = { workspace = true, optional = true }
sdkwork_routes_course_backend_api = { workspace = true, optional = true }
sdkwork-course-gateway-assembly = { path = "../../../sdkwork-course/crates/sdkwork-course-gateway-assembly", optional = true }
sdkwork_routes_news_app_api = { workspace = true, optional = true }
sdkwork_routes_news_backend_api = { workspace = true, optional = true }
sdkwork_routes_news_open_api = { workspace = true, optional = true }
sdkwork_routes_image_app_api = { workspace = true, optional = true }
sdkwork_routes_image_backend_api = { workspace = true, optional = true }
sdkwork_routes_image_open_api = { workspace = true, optional = true }
sdkwork_routes_forum_app_api = { workspace = true, optional = true }
sdkwork_routes_forum_backend_api = { workspace = true, optional = true }
sdkwork_routes_forum_open_api = { workspace = true, optional = true }
sdkwork_routes_music_app_api = { workspace = true, optional = true }
sdkwork_routes_music_backend_api = { workspace = true, optional = true }
sdkwork_routes_messaging_app_api = { workspace = true, optional = true }
sdkwork_routes_messaging_backend_api = { workspace = true, optional = true }
sdkwork_routes_community_app_api = { workspace = true, optional = true }
sdkwork_routes_cms_app_api = { workspace = true, optional = true }
sdkwork_routes_cms_backend_api = { workspace = true, optional = true }
sdkwork_routes_cms_open_api = { workspace = true, optional = true }
sdkwork_routes_voice_app_api = { workspace = true, optional = true }
sdkwork_routes_voice_backend_api = { workspace = true, optional = true }
sdkwork_routes_aiot_app_api = { workspace = true, optional = true }
sdkwork_routes_catalog_app_api = { workspace = true, optional = true }
sdkwork_routes_catalog_backend_api = { workspace = true, optional = true }
sdkwork_routes_catalog_open_api = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
http-body-util.workspace = true
sdkwork-web-core.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true

[[bin]]
name = "sdkwork-api-cloud-gateway"
path = "src/listener_main.rs"
