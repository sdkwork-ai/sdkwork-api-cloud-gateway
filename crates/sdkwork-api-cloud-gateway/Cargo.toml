[package]
name = "sdkwork-api-cloud-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["foundation-appbase"]
foundation-appbase = [
    "dep:sdkwork_routes_iam_app_api",
    "dep:sdkwork_routes_iam_backend_api",
    "dep:sdkwork-iam-web-adapter",
    "dep:sdkwork-iam-database-host",
    "dep:sdkwork-iam-embedded-application-bootstrap",
]
foundation-course = [
    "dep:sdkwork_routes_course_app_api",
    "dep:sdkwork_routes_course_backend_api",
    "dep:sdkwork-course-gateway-assembly",
]
foundation-news = ["dep:sdkwork_routes_news_app_api", "dep:sdkwork_routes_news_backend_api", "dep:sdkwork_routes_news_open_api", "dep:sdkwork-news-gateway-assembly"]
foundation-image = ["dep:sdkwork_routes_image_app_api", "dep:sdkwork_routes_image_backend_api", "dep:sdkwork_routes_image_open_api", "dep:sdkwork-image-gateway-assembly"]
foundation-music = ["dep:sdkwork_routes_music_app_api", "dep:sdkwork_routes_music_backend_api", "dep:sdkwork-music-gateway-assembly"]
foundation-messaging = ["dep:sdkwork_routes_messaging_app_api", "dep:sdkwork_routes_messaging_backend_api", "dep:sdkwork-messaging-gateway-assembly"]
foundation-community = ["dep:sdkwork_routes_community_app_api", "dep:sdkwork-community-gateway-assembly"]
foundation-cms = ["dep:sdkwork_routes_cms_app_api", "dep:sdkwork_routes_cms_backend_api", "dep:sdkwork_routes_cms_open_api", "dep:sdkwork-cms-gateway-assembly"]
foundation-voice = ["dep:sdkwork_routes_voice_app_api", "dep:sdkwork_routes_voice_backend_api", "dep:sdkwork-voice-gateway-assembly"]
foundation-aiot = ["dep:sdkwork_routes_aiot_app_api", "dep:sdkwork-aiot-gateway-assembly"]
foundation-appstore = ["dep:sdkwork_routes_catalog_app_api", "dep:sdkwork_routes_catalog_backend_api", "dep:sdkwork_routes_catalog_open_api", "dep:sdkwork-appstore-gateway-assembly"]
foundation-forum = ["dep:sdkwork_routes_forum_app_api", "dep:sdkwork_routes_forum_backend_api", "dep:sdkwork_routes_forum_open_api", "dep:sdkwork-forum-gateway-assembly"]
foundation-comments = ["dep:sdkwork-comments-gateway-assembly"]
foundation-clawrouter = ["dep:sdkwork-clawrouter-gateway-assembly"]
foundation-llm = ["dep:sdkwork-llm-gateway-assembly"]
foundation-mcp = ["dep:sdkwork-mcp-gateway-assembly"]
foundation-im = ["dep:sdkwork-im-gateway-assembly"]
foundation-rtc = ["dep:sdkwork-rtc-gateway-assembly"]
foundation-notary = ["dep:sdkwork-notary-gateway-assembly"]
foundation-mail = ["dep:sdkwork-mail-gateway-assembly"]

