[package]
name = "sdkwork-api-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["foundation-appbase"]
foundation-appbase = [
    "dep:sdkwork_router_iam_app_api",
    "dep:sdkwork_router_iam_backend_api",
    "dep:sdkwork-iam-web-adapter",
]
foundation-course = ["dep:sdkwork_router_course_app_api", "dep:sdkwork_router_course_backend_api"]
foundation-news = ["dep:sdkwork_router_news_app_api", "dep:sdkwork_router_news_backend_api", "dep:sdkwork_router_news_open_api"]
foundation-image = ["dep:sdkwork_router_image_app_api", "dep:sdkwork_router_image_backend_api", "dep:sdkwork_router_image_open_api"]
foundation-forum = ["dep:sdkwork_router_forum_app_api", "dep:sdkwork_router_forum_backend_api", "dep:sdkwork_router_forum_open_api"]
foundation-music = ["dep:sdkwork_router_music_app_api", "dep:sdkwork_router_music_backend_api"]
foundation-messaging = ["dep:sdkwork_router_messaging_app_api", "dep:sdkwork_router_messaging_backend_api"]
foundation-community = ["dep:sdkwork_router_community_app_api"]
foundation-cms = ["dep:sdkwork_router_cms_app_api", "dep:sdkwork_router_cms_backend_api", "dep:sdkwork_router_cms_open_api"]
foundation-voice = ["dep:sdkwork_router_voice_app_api", "dep:sdkwork_router_voice_backend_api"]
foundation-aiot = ["dep:sdkwork_router_aiot_app_api"]
foundation-appstore = ["dep:sdkwork_router_catalog_app_api", "dep:sdkwork_router_catalog_backend_api", "dep:sdkwork_router_catalog_open_api"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
sdkwork-api-gateway-config.workspace = true
sdkwork-api-gateway-observability.workspace = true
sdkwork-api-gateway-registry.workspace = true
sdkwork-web-contract.workspace = true
sdkwork-web-core.workspace = true
sdkwork-web-axum.workspace = true
sdkwork-utils-rust.workspace = true
sdkwork-iam-web-adapter = { workspace = true, optional = true }
sdkwork_router_iam_app_api = { workspace = true, optional = true }
sdkwork_router_iam_backend_api = { workspace = true, optional = true }
sdkwork_router_course_app_api = { workspace = true, optional = true }
sdkwork_router_course_backend_api = { workspace = true, optional = true }
sdkwork_router_news_app_api = { workspace = true, optional = true }
sdkwork_router_news_backend_api = { workspace = true, optional = true }
sdkwork_router_news_open_api = { workspace = true, optional = true }
sdkwork_router_image_app_api = { workspace = true, optional = true }
sdkwork_router_image_backend_api = { workspace = true, optional = true }
sdkwork_router_image_open_api = { workspace = true, optional = true }
sdkwork_router_forum_app_api = { workspace = true, optional = true }
sdkwork_router_forum_backend_api = { workspace = true, optional = true }
sdkwork_router_forum_open_api = { workspace = true, optional = true }
sdkwork_router_music_app_api = { workspace = true, optional = true }
sdkwork_router_music_backend_api = { workspace = true, optional = true }
sdkwork_router_messaging_app_api = { workspace = true, optional = true }
sdkwork_router_messaging_backend_api = { workspace = true, optional = true }
sdkwork_router_community_app_api = { workspace = true, optional = true }
sdkwork_router_cms_app_api = { workspace = true, optional = true }
sdkwork_router_cms_backend_api = { workspace = true, optional = true }
sdkwork_router_cms_open_api = { workspace = true, optional = true }
sdkwork_router_voice_app_api = { workspace = true, optional = true }
sdkwork_router_voice_backend_api = { workspace = true, optional = true }
sdkwork_router_aiot_app_api = { workspace = true, optional = true }
sdkwork_router_catalog_app_api = { workspace = true, optional = true }
sdkwork_router_catalog_backend_api = { workspace = true, optional = true }
sdkwork_router_catalog_open_api = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
http-body-util.workspace = true
sdkwork-web-core.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
serde_json.workspace = true
