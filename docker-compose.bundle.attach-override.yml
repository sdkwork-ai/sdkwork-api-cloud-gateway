# Attach-contract override for the sdkwork-webserver public edge.
#
# SDKWORK_WEBSERVER_SPEC.md §17.3: imported webserver module sidecars dial the
# canonical upstream `sdkwork-api-cloud-gateway:8080` checkout-direct, never
# rewritten. Every attached gateway deployment MUST therefore
#   (a) register the network alias `sdkwork-api-cloud-gateway` on its compose
#       network, and
#   (b) answer on container port 8080 (the bundle default listener is 3900).
#
# This file is environment-neutral: the host port is supplied by deploy.sh as
# GATEWAY_INSTANCE_HOST_PORT (base GATEWAY_HOST_PORT + 10 per instance).
#
# Apply with the instance project:
#   docker compose -p sdkwork-api-cloud-gateway-<env>-i<N> \
#     --env-file env/<env>.env \
#     -f compose/docker-compose.bundle.yml \
#     -f compose/docker-compose.bundle.attach-override.yml \
#     --profile instance up -d --force-recreate gateway
# Bounded json-file log rotation: unbounded container logs eventually fill
# the host disk on long-lived deployments (OPERATIONS_SPEC.md §2.3).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
services:
  gateway:
    ports: !override
      - "${GATEWAY_INSTANCE_HOST_PORT:?required}:8080"
    environment:
      SDKWORK_API_CLOUD_GATEWAY_BIND: 0.0.0.0:8080
      # Canonical split-vs-embedded axis read by embedded Rust SDK consumers.
      # This process composes the Cloud Router surface in-process, so the agents
      # turn path must select its in-process transport instead of dialling a
      # loopback port this container may not own.
      SDKWORK_DEPLOYMENT_PROFILE: ${GATEWAY_DEPLOYMENT_PROFILE:-standalone}
      # Cloud Router is composed inside this process; the in-process turn
      # transport dispatches into the mounted assembly. This ingress bind is
      # published for diagnostics and must track the listener, but it is never
      # turned into a loopback base URL (the profile above selects the arm).
      SDKWORK_CLOUDROUTER_ROUTER_APPLICATION_PUBLIC_INGRESS_BIND: 0.0.0.0:8080
    networks:
      sdkwork:
        aliases:
          - sdkwork-api-cloud-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"