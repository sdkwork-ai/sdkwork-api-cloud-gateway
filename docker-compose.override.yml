# Override: align the gateway container with the sdkwork-webserver attach
# contract (SDKWORK_WEBSERVER_SPEC.md §17.3, docker-compose.platform-api-gateway-
# attach.yml). Imported webserver sidecars dial the canonical upstream
# `sdkwork-api-cloud-gateway:8080` checkout-direct (never rewritten), so the
# attached gateway deployment MUST (a) register the network alias
# `sdkwork-api-cloud-gateway` on its compose network and (b) answer on 8080.
# This override rebinds the API listener 3900 -> 8080, keeps the usual host
# debug port pointed at it, and moves the readiness probe accordingly.
# Apply with:
#   docker compose -p sdkwork-gateway-<env> \
#     -f docker-compose.yml -f docker-compose.override.yml \
#     --env-file docker/env/<env>.env up -d gateway
# Bounded json-file log rotation: unbounded container logs eventually fill
# the host disk on long-lived deployments (OPERATIONS_SPEC.md §2.3).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
services:
  gateway:
    ports: !override
      - "${GATEWAY_HOST_PORT:-3910}:${GATEWAY_CONTAINER_PORT:-8080}"
    environment:
      SDKWORK_API_CLOUD_GATEWAY_BIND: 0.0.0.0:${GATEWAY_CONTAINER_PORT:-8080}
      # Canonical split-vs-embedded axis read by embedded Rust SDK consumers.
      # It must follow the attached listener configuration: this process composes
      # the Cloud Router surface in-process, so the agents turn path must select
      # its in-process transport instead of dialling a loopback port.
      SDKWORK_DEPLOYMENT_PROFILE: ${GATEWAY_DEPLOYMENT_PROFILE:-standalone}
      # Cloud Router is composed in this process. The in-process turn transport
      # dispatches into the mounted assembly; this ingress bind is published for
      # diagnostics and must track the listener, but it is never turned into a
      # loopback base URL (the profile above selects the transport arm).
      SDKWORK_CLOUDROUTER_ROUTER_APPLICATION_PUBLIC_INGRESS_BIND: 0.0.0.0:${GATEWAY_CONTAINER_PORT:-8080}
    networks:
      default:
        aliases:
          - sdkwork-api-cloud-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${GATEWAY_CONTAINER_PORT:-8080}/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"