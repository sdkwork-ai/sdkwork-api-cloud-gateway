# sdkwork-api-cloud-gateway standalone container composition.
#
# runtimeTarget = "container", deploymentProfile = "standalone".
# Install layout matches Ubuntu (APPLICATION_DEPLOY_LAYOUT_SPEC):
#   config  /etc/sdkwork/api-gateway/config.toml
#   secrets /run/secrets/sdkwork/api-gateway
#   data    /var/lib/sdkwork/api-gateway
#   install /opt/sdkwork/api-gateway
#
# Default dependency posture (RUNTIME_DIRECTORY_SPEC §4.5):
#   external PostgreSQL + Redis (no password on Redis). Point
#   GATEWAY_POSTGRES_* / GATEWAY_CLOUDROUTER_REDIS_* at the host or a managed
#   endpoint. Built-in postgres/redis containers are opt-in via profile
#   `embedded` (`docker compose --profile embedded -f docker-compose.yml
#   -f docker-compose.embedded.yml up -d`).
#
# Public reverse proxy is owned by the independent sdkwork-webserver product.
# This composition does not install or map nginx sites.
#
# Port strategy: container listens on 0.0.0.0:3900; host maps
# GATEWAY_HOST_PORT (3910–3913 per environment) -> 3900.

services:
  postgres:
    profiles: ["embedded"]
    # pgvector image: the knowledgebase foundation module requires the
    # `vector` extension, which the stock postgres image does not ship.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # Bounded log rotation (DEPLOYMENT_SPEC §6 runtime hardening, normative).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    entrypoint: ["/bin/sh", "/opt/sdkwork/postgres/entrypoint.sh"]
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
    environment:
      POSTGRES_DB: ${GATEWAY_POSTGRES_DB:-sdkwork_ai_prod}
      POSTGRES_USER: ${GATEWAY_POSTGRES_USER:-sdkwork_ai_prod}
      POSTGRES_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:-sdkwork_ai_prod}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/entrypoint.sh:/opt/sdkwork/postgres/entrypoint.sh:ro
      - postgres-tls:/var/run/sdkwork-postgres-tls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GATEWAY_POSTGRES_USER:-sdkwork_ai_prod} -d ${GATEWAY_POSTGRES_DB:-sdkwork_ai_prod}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    profiles: ["embedded"]
    # Opt-in only. Default deployments use external Redis with no password.
    image: redis:8-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  knowledgebase-rpc:
    image: ${GATEWAY_IMAGE:-sdkwork-api-cloud-gateway:local}
    entrypoint: ["/opt/sdkwork/api-gateway/container/knowledgebase-rpc-entrypoint"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SDKWORK_KNOWLEDGEBASE_ENVIRONMENT: ${GATEWAY_KNOWLEDGEBASE_ENVIRONMENT:-development}
      SDKWORK_KNOWLEDGEBASE_DEPLOYMENT_PROFILE: standalone
      SDKWORK_KNOWLEDGEBASE_RPC_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_BIND_ADDR: 0.0.0.0:50054
      SDKWORK_KNOWLEDGEBASE_RPC_TLS_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_MTLS_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_HEALTH_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_SERVER_CERT_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/server.crt
      SDKWORK_KNOWLEDGEBASE_RPC_SERVER_KEY_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/server.key
      SDKWORK_KNOWLEDGEBASE_RPC_CLIENT_CA_CERTIFICATE_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/ca.crt
      SDKWORK_KNOWLEDGEBASE_RPC_SPIFFE_TRUST_DOMAIN: sdkwork.internal
      SDKWORK_KNOWLEDGEBASE_RPC_IM_CALLER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/caller-context.key
      SDKWORK_KNOWLEDGEBASE_DRIVE_STORAGE_ROOT: /var/lib/sdkwork/api-gateway/knowledgebase-drive
      SDKWORK_KNOWLEDGEBASE_OPERATOR_ID: sdkwork-knowledgebase
      SDKWORK_KNOWLEDGEBASE_ACTOR_ID: ${GATEWAY_KNOWLEDGEBASE_ACTOR_ID:-1}
      SDKWORK_KNOWLEDGEBASE_TENANT_ID: ${GATEWAY_KNOWLEDGEBASE_TENANT_ID:-100001}
      SDKWORK_KNOWLEDGEBASE_ORGANIZATION_ID: ${GATEWAY_KNOWLEDGEBASE_ORGANIZATION_ID:-1}
      SDKWORK_DATABASE_URL: ${SDKWORK_DATABASE_URL:-postgresql://${GATEWAY_POSTGRES_USER:-sdkwork_ai_dev}:${GATEWAY_POSTGRES_PASSWORD:-sdkworkdev123}@${GATEWAY_POSTGRES_HOST:-host.docker.internal}:${GATEWAY_POSTGRES_PORT:-5432}/${GATEWAY_POSTGRES_DB:-sdkwork_ai_dev}?sslmode=${GATEWAY_POSTGRES_SSL_MODE:-disable}&options=-c%20search_path%3D${GATEWAY_POSTGRES_SCHEMA:-sdkwork_ai_dev}}
      SDKWORK_API_CLOUD_GATEWAY_PROVISION_KNOWLEDGEBASE_RPC_SECRETS: ${GATEWAY_PROVISION_KNOWLEDGEBASE_RPC_SECRETS:-true}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gateway-data:/var/lib/sdkwork/api-gateway
      - gateway-secrets:/run/secrets/sdkwork/api-gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/50054'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  gateway:
    image: ${GATEWAY_IMAGE:-sdkwork-api-cloud-gateway:local}
    ports:
      - "${GATEWAY_HOST_PORT:-3910}:3900"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Deployment identity (DEPLOYMENT_SPEC §5.2); the entrypoint pins these
      # too, so the values here are belt-and-suspenders.
      SDKWORK_API_CLOUD_GATEWAY_DEPLOYMENT_PROFILE: standalone
      SDKWORK_API_CLOUD_GATEWAY_RUNTIME_TARGET: container
      SDKWORK_API_CLOUD_GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-development}
      SDKWORK_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-development}
      SDKWORK_API_CLOUD_GATEWAY_PROFILE_ID: ${GATEWAY_PROFILE_ID:-standalone.development}
      # Runtime config comes from the mounted host copy at
      # /etc/sdkwork/api-gateway/config.toml (APPLICATION_DEPLOY_LAYOUT_SPEC /
      # RUNTIME_DIRECTORY_SPEC §4.5 config mount; the image bakes the production
      # template as the same file);
      # environment variables take precedence over it (ENVIRONMENT_SPEC §3),
      # so only the container-specific values are injected here.
      SDKWORK_API_CLOUD_GATEWAY_BIND: 0.0.0.0:3900
      # Host allowlist: registered API domains plus host-mapped port for direct
      # access. sdkwork-webserver (independent deploy) forwards Host when it
      # reverse-proxies to GATEWAY_HOST_PORT. Empty = accept all Host headers.
      # GATEWAY_SECURITY_ALLOW_IP_HOSTS=true additionally accepts raw IP
      # literal Host headers (direct host-IP access without editing the list).
      SDKWORK_API_CLOUD_GATEWAY_ALLOWED_HOSTS: ${GATEWAY_ALLOWED_HOSTS:-}
      SDKWORK_API_CLOUD_GATEWAY_SECURITY_ALLOW_IP_HOSTS: ${GATEWAY_SECURITY_ALLOW_IP_HOSTS:-false}
      # Browser CORS allow-list (API plane): the gateway runs in production
      # posture, where cross-origin browser requests are rejected unless the
      # origin is listed here. SDKWORK_CORS_ALLOWED_ORIGINS is the canonical
      # shared key (SOURCE_CONFIG_SPEC) resolved by both the gateway and the
      # IAM web adapter.
      SDKWORK_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://api-dev.sdkwork.com,http://api-dev.birdcoder.com,http://api-dev.dtupay.com,http://localhost:3910,http://127.0.0.1:3910,app://dsh,app://birdcoder,app://sdkwork,app://dtupay,tauri://localhost,https://servicewechat.com}
      # External dependencies are injected at runtime, not baked into the image.
      # Split database fields (with explicit schema) instead of a raw URL so
      # the lifecycle schema identity is unambiguous.
      # Default: external PostgreSQL (RUNTIME_DIRECTORY_SPEC §4.5).
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: ${GATEWAY_POSTGRES_HOST:-host.docker.internal}
      SDKWORK_DATABASE_PORT: ${GATEWAY_POSTGRES_PORT:-5432}
      SDKWORK_DATABASE_NAME: ${GATEWAY_POSTGRES_DB:-sdkwork_ai_dev}
      SDKWORK_DATABASE_SCHEMA: ${GATEWAY_POSTGRES_SCHEMA:-sdkwork_ai_dev}
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: ${GATEWAY_POSTGRES_USER:-sdkwork_ai_dev}
      SDKWORK_DATABASE_PASSWORD: ${GATEWAY_POSTGRES_PASSWORD:-sdkworkdev123}
      SDKWORK_DATABASE_SSL_MODE: ${GATEWAY_POSTGRES_SSL_MODE:-disable}
      SDKWORK_DATABASE_URL: ${SDKWORK_DATABASE_URL:-postgresql://${GATEWAY_POSTGRES_USER:-sdkwork_ai_dev}:${GATEWAY_POSTGRES_PASSWORD:-sdkworkdev123}@${GATEWAY_POSTGRES_HOST:-host.docker.internal}:${GATEWAY_POSTGRES_PORT:-5432}/${GATEWAY_POSTGRES_DB:-sdkwork_ai_dev}?sslmode=${GATEWAY_POSTGRES_SSL_MODE:-disable}&options=-c%20search_path%3D${GATEWAY_POSTGRES_SCHEMA:-sdkwork_ai_dev}}
      # External TLS: leave CA empty for sslmode=disable; set GATEWAY_POSTGRES_CA_FILE
      # when sslmode=require against an internal CA.
      SDKWORK_API_CLOUD_GATEWAY_POSTGRES_CA_FILE: ${GATEWAY_POSTGRES_CA_FILE:-}
      SSL_CERT_FILE: ${GATEWAY_POSTGRES_SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
      # Connection pool sizing: the foundation suite bootstraps 46 database
      # modules through the process-shared pool at startup; keep the server
      # max_connections comfortably above the pool ceiling.
      SDKWORK_DATABASE_MAX_CONNECTIONS: ${SDKWORK_DATABASE_MAX_CONNECTIONS:-50}
      SDKWORK_DATABASE_MIN_CONNECTIONS: ${SDKWORK_DATABASE_MIN_CONNECTIONS:-5}
      SDKWORK_DATABASE_ACQUIRE_TIMEOUT: ${SDKWORK_DATABASE_ACQUIRE_TIMEOUT:-30}
      SDKWORK_DATABASE_IDLE_TIMEOUT: ${SDKWORK_DATABASE_IDLE_TIMEOUT:-600}
      SDKWORK_DATABASE_MAX_LIFETIME: ${SDKWORK_DATABASE_MAX_LIFETIME:-1800}
      # Temporary driver pool reservations: the IM module (and peers) reserve
      # r2d2 capacity before process-pool bootstrap; without these, embedded
      # router construction fails ("IM r2d2 capacity was not reserved").
      SDKWORK_DATABASE_TEMPORARY_DRIVER_POOL_COUNT: ${SDKWORK_DATABASE_TEMPORARY_DRIVER_POOL_COUNT:-2}
      SDKWORK_DATABASE_TEMPORARY_ANY_POOL_EXCEPTION: ${SDKWORK_DATABASE_TEMPORARY_ANY_POOL_EXCEPTION:-true}
      # Client-local SQLite store (ENVIRONMENT_SPEC §7.2): SQLite-only embedded
      # apps (canvas pages) persist here while every other module uses PostgreSQL.
      # mode=rwc creates the file on first start inside the gateway-data volume.
      SDKWORK_DATABASE_SQLITE_URL: ${GATEWAY_DATABASE_SQLITE_URL:-sqlite:///var/lib/sdkwork/api-gateway/canvas-pages.db?mode=rwc}
      # IM principal directory: all container profiles use the dynamic
      # PostgreSQL directory. This admits IAM-authenticated principals on
      # first sight and persists the decision for audit.
      SDKWORK_IM_ENVIRONMENT: ${GATEWAY_IM_ENVIRONMENT:-development}
      SDKWORK_IM_PRINCIPAL_DIRECTORY: ${GATEWAY_IM_PRINCIPAL_DIRECTORY:-postgres}
      SDKWORK_IM_ID_NODE_ID: ${GATEWAY_IM_ID_NODE_ID:-2}
      # BirdCoder embedded app: fail-closed config requires all three explicitly.
      SDKWORK_BIRDCODER_ENVIRONMENT: ${GATEWAY_BIRDCODER_ENVIRONMENT:-development}
      SDKWORK_BIRDCODER_DEPLOYMENT_PROFILE: ${GATEWAY_BIRDCODER_DEPLOYMENT_PROFILE:-standalone}
      SDKWORK_BIRDCODER_RUNTIME_TARGET: ${GATEWAY_BIRDCODER_RUNTIME_TARGET:-container}
      SDKWORK_IAM_SIGNING_MASTER_SECRET_FILE: /run/secrets/sdkwork/api-gateway/iam-signing-master.key
      SDKWORK_API_CLOUD_GATEWAY_PROVISION_IAM_SIGNING_MASTER_SECRET: ${GATEWAY_PROVISION_IAM_SIGNING_MASTER_SECRET:-true}
      SDKWORK_API_CLOUD_GATEWAY_IAM_ALLOWED_AUDIENCES: ${GATEWAY_IAM_ALLOWED_AUDIENCES:-sdkwork-api-cloud-gateway}
      SDKWORK_IM_GROUP_KNOWLEDGEBASE_LAUNCH_TICKET_SECRET_FILE: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/im-launch-ticket.key
      # IM -> Knowledgebase lifecycle uses the generated RPC SDK over the
      # single-node composition's persistent mTLS and signed caller context.
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_ENDPOINT: ${GATEWAY_KNOWLEDGEBASE_RPC_ENDPOINT:-https://knowledgebase-rpc:50054}
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_CA_CERT_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/ca.crt
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_CERT_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/client.crt
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_KEY_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/client.key
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_TLS_DOMAIN: knowledgebase.local
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_CALLER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/caller-context.key
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_CREDENTIAL_TTL_SECONDS: ${GATEWAY_KNOWLEDGEBASE_RPC_CREDENTIAL_TTL_SECONDS:-60}
      SDKWORK_IM_KNOWLEDGEBASE_RPC_CLIENT_TIMEOUT_MS: ${GATEWAY_KNOWLEDGEBASE_RPC_TIMEOUT_MS:-5000}
      # RTC hydrate scope: the assembly loads runtime persistence for the
      # deployment tenant; empty databases hydrate as empty (Ok).
      SDKWORK_RTC_HYDRATE_TENANT_ID: ${GATEWAY_RTC_HYDRATE_TENANT_ID:-100001}
      SDKWORK_RTC_HYDRATE_ORGANIZATION_ID: ${GATEWAY_RTC_HYDRATE_ORGANIZATION_ID:-0}
      # Knowledgebase deployment scope (production-like runtime requires them).
      SDKWORK_KNOWLEDGEBASE_DEPLOYMENT_PROFILE: standalone
      SDKWORK_KNOWLEDGEBASE_TENANT_ID: ${GATEWAY_KNOWLEDGEBASE_TENANT_ID:-100001}
      SDKWORK_KNOWLEDGEBASE_ORGANIZATION_ID: ${GATEWAY_KNOWLEDGEBASE_ORGANIZATION_ID:-1}
      SDKWORK_KNOWLEDGEBASE_SECRETS_ENCRYPTION_KEY_FILE: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/knowledgebase-secrets.key
      # Managed Knowledgebase Provider credentials resolve secret:// locators
      # through Vault first when configured, then this operator-managed mount.
      SDKWORK_SECRETS_DIR: /run/secrets/sdkwork/api-gateway
      SDKWORK_VAULT_ADDR: ${GATEWAY_VAULT_ADDR:-}
      SDKWORK_VAULT_TOKEN: ${GATEWAY_VAULT_TOKEN:-}
      SDKWORK_VAULT_MOUNT: ${GATEWAY_VAULT_MOUNT:-secret}
      SDKWORK_VAULT_NAMESPACE: ${GATEWAY_VAULT_NAMESPACE:-}
      # sdkwork-webserver is an independent Docker deployment — never started
      # by this gateway composition. Public reverse proxy is configured there.
      SDKWORK_KNOWLEDGEBASE_ENVIRONMENT: ${GATEWAY_KNOWLEDGEBASE_ENVIRONMENT:-development}
      SDKWORK_IM_ALLOW_ALL_PRINCIPALS: ${GATEWAY_IM_ALLOW_ALL_PRINCIPALS:-false}
      # Cloud Router OpenAPI base URL: the image generation foundation module
      # requires it to reach the cloud router's OpenAPI surface. Defaults to
      # the sdkwork-cloudrouter container host mapping on this machine.
      SDKWORK_CLOUDROUTER_OPEN_API_BASE_URL: ${GATEWAY_CLOUDROUTER_OPEN_API_BASE_URL:-http://127.0.0.1:3900}
      # Cloud Router web environment: unset/unknown values fail closed to the
      # production posture (production assembly validation), so every env file
      # must set GATEWAY_CLOUDROUTER_ROUTER_ENVIRONMENT explicitly.
      SDKWORK_CLOUDROUTER_ROUTER_ENVIRONMENT: ${GATEWAY_CLOUDROUTER_ROUTER_ENVIRONMENT:-}
      # Cloud Router API key pepper: required by the cloudrouter foundation
      # module's OpenAI runtime routes; injected at runtime, never baked into
      # the image. Override via .env for anything beyond local testing.
      SDKWORK_CLOUDROUTER_API_KEY_PEPPER: ${GATEWAY_CLOUDROUTER_API_KEY_PEPPER:-cloudrouter-local-dev-pepper-change-me}
      # Cloud Router upstream credential encryption key ring (camelCase JSON,
      # keys >= 32 bytes) required for PostgreSQL upstream routing. Local test
      # default; regenerate for any real deployment.
      SDKWORK_CLOUDROUTER_UPSTREAM_CREDENTIAL_KEY_RING: '${GATEWAY_CLOUDROUTER_UPSTREAM_CREDENTIAL_KEY_RING:-{"activeKeyId":"local-dev-key-ring-001","activeKey":"dyfeQDB++uTwSSRGuRju9yHE8iX3wTH+ySmqpjimX6w=","fingerprintKey":"kg/5KOatnHH9XgtbCS16VkjUEQoohdS5miD2U5GhtBc=","decryptionKeys":[]}}'
      # Cloud Router all-in-one runtime secrets (trusted subject, app session,
      # payment webhook, internal signing). Local test defaults matching the
      # sdkwork-cloudrouter compose; override via .env for anything real.
      SDKWORK_CLOUDROUTER_TRUSTED_SUBJECT_SECRET: ${GATEWAY_CLOUDROUTER_TRUSTED_SUBJECT_SECRET:-cloudrouter-local-dev-trusted-subject-change-me}
      SDKWORK_CLOUDROUTER_APP_SESSION_SECRET: ${GATEWAY_CLOUDROUTER_APP_SESSION_SECRET:-cloudrouter-local-dev-app-session-change-me}
      SDKWORK_CLOUDROUTER_PAYMENT_WEBHOOK_SECRET: ${GATEWAY_CLOUDROUTER_PAYMENT_WEBHOOK_SECRET:-cloudrouter-local-dev-payment-webhook-change-me}
      SDKWORK_CLOUDROUTER_INTERNAL_GATEWAY_SIGNING_SECRET: ${GATEWAY_CLOUDROUTER_INTERNAL_GATEWAY_SIGNING_SECRET:-cloudrouter-local-dev-signing-secret-change-me}
      # The entrypoint runs the single-process `--migrate-databases` lifecycle
      # command before starting the service. Runtime auto-migration stays off,
      # including production; set MIGRATE_ON_START=false when another elected
      # release job owns migrations.
      SDKWORK_API_CLOUD_GATEWAY_MIGRATE_ON_START: ${GATEWAY_MIGRATE_ON_START:-true}
      SDKWORK_DATABASE_AUTO_MIGRATE: ${SDKWORK_DATABASE_AUTO_MIGRATE:-false}
      # Default: external Redis, no password (GATEWAY_CLOUDROUTER_REDIS_*).
      SDKWORK_CLOUDROUTER_REDIS_ENABLED: "true"
      SDKWORK_CLOUDROUTER_REDIS_HOST: ${GATEWAY_CLOUDROUTER_REDIS_HOST:-host.docker.internal}
      SDKWORK_CLOUDROUTER_REDIS_PORT: ${GATEWAY_CLOUDROUTER_REDIS_PORT:-6380}
      SDKWORK_CLOUDROUTER_REDIS_DATABASE: ${GATEWAY_CLOUDROUTER_REDIS_DATABASE:-0}
      SDKWORK_CLOUDROUTER_REDIS_USERNAME: ${GATEWAY_CLOUDROUTER_REDIS_USERNAME:-}
      SDKWORK_CLOUDROUTER_REDIS_PASSWORD: ${GATEWAY_CLOUDROUTER_REDIS_PASSWORD:-}
      SDKWORK_CLOUDROUTER_REDIS_PASSWORD_FILE: ${GATEWAY_CLOUDROUTER_REDIS_PASSWORD_FILE:-}
      SDKWORK_CLOUDROUTER_REDIS_TLS: ${GATEWAY_CLOUDROUTER_REDIS_TLS:-false}
      SDKWORK_CLOUDROUTER_REDIS_KEY_PREFIX: ${GATEWAY_CLOUDROUTER_REDIS_KEY_PREFIX:-cloudrouter}
      SDKWORK_CLOUDROUTER_REDIS_MAX_CONNECTIONS: ${GATEWAY_CLOUDROUTER_REDIS_MAX_CONNECTIONS:-50}
      # Shared external Redis; DB indexes isolate RTC / web keys.
      SDKWORK_RTC_STATE_REDIS_URL: ${GATEWAY_RTC_STATE_REDIS_URL:-redis://host.docker.internal:6380/1}
      SDKWORK_API_CLOUD_GATEWAY_WEB_REDIS_URL: ${GATEWAY_WEB_REDIS_URL:-redis://host.docker.internal:6380/2}
      # Image generation Drive import object store: the default is a relative
      # `.data` path which is not writable inside the container (install root
      # is read-only for the sdkwork user); point it at the durable data
      # volume (RUNTIME_DIRECTORY_SPEC §4.5).
      IMAGE_DRIVE_OBJECT_STORE_ROOT: /var/lib/sdkwork/api-gateway/image-drive-objects
      # Voice generation Drive sync object store: same relative-`.data` default
      # problem as the image module; point it at the durable data volume.
      VOICE_DRIVE_OBJECT_STORE_ROOT: /var/lib/sdkwork/api-gateway/voice-drive-objects
      # Deployments Drive sandbox defaults to /opt/deploy (host install layout);
      # the sdkwork container user cannot create that path — use the data volume.
      SDKWORK_DEPLOY_SANDBOX_ROOT: /var/lib/sdkwork/api-gateway/deploy-sandbox
      # Payment credential master key: the single-node composition provisions
      # it once in the canonical secret mount. Multi-replica deployments must
      # set provisioning false and mount the same operator/KMS-managed key.
      SDKWORK_PAYMENT_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/sdkwork/api-gateway/payment-credential-master.key
      SDKWORK_API_CLOUD_GATEWAY_PROVISION_PAYMENT_CREDENTIAL_KEY: ${GATEWAY_PROVISION_PAYMENT_CREDENTIAL_KEY:-true}
      # Process log level (tracing reads RUST_LOG directly).
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Runtime config at the canonical container path (§4.5 config mount):
      # the host copy overrides the image-baked production template without a
      # rebuild. Environment variables below still win over it (ENVIRONMENT_SPEC
      # §3 precedence: defaults -> TOML -> process env -> CLI -> secrets).
      # Same Ubuntu install path: /etc/sdkwork/api-gateway/config.toml
      - ./docker/config/config.toml:/etc/sdkwork/api-gateway/config.toml:ro
      - gateway-data:/var/lib/sdkwork/api-gateway
      - gateway-secrets:/run/secrets/sdkwork/api-gateway
      # Optional private PostgreSQL CA for external TLS. Default /dev/null
      # keeps the ro bind mount harmless when no CA is configured: an absent
      # host source would make docker create a stray directory on the host,
      # and a real file mount here would collide with the entrypoint's merged
      # trust-bundle write target when SSL_CERT_FILE points at the same path.
      - ${GATEWAY_POSTGRES_CA_FILE_MOUNT:-/dev/null}:/run/sdkwork/api-gateway/postgres-ca-bundle.crt:ro
    depends_on:
      knowledgebase-rpc:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Gateway readiness probe: compose can restart/replace the gateway when it
    # stops answering. The start_period covers the foundation suite module
    # migrations that run on first start.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3900/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s
    # Deployment guardrails: bound the gateway to predictable CPU and memory
    # (tune via .env) so noisy neighbors cannot starve the host.
    deploy:
      resources:
        limits:
          cpus: ${GATEWAY_CPU_LIMIT:-2.0}
          memory: ${GATEWAY_MEMORY_LIMIT:-2g}
        reservations:
          cpus: ${GATEWAY_CPU_RESERVATION:-0.5}
          memory: ${GATEWAY_MEMORY_RESERVATION:-512m}

volumes:
  postgres-data:
  redis-data:
  gateway-data:
  gateway-secrets:
  postgres-tls:
